name: CI

on:
  push:
    branches: [main]
  pull_request:

# If a new run starts, cancel any older run for the same workflow and PR/branch.
# Otherwise, a quick series of pushes would queue several full CI jobs, and only the latest one matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: 1.7.12

permissions:
  contents: read

jobs:
  checks:
    name: Lint and safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt,llvm-tools-preview
          rustup default stable

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-machete, cargo-llvm-cov, cargo-audit, cargo-issafe, cargo-deny, just, shuck-cli, zizmor

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          gh release download "v$ACTIONLINT_VERSION" --repo rhysd/actionlint --pattern "$name" --dir "$RUNNER_TEMP/actionlint"
          gh attestation verify "$RUNNER_TEMP/actionlint/$name" --repo rhysd/actionlint
          tar -xzf "$RUNNER_TEMP/actionlint/$name" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint
        run: just lint

      - name: Lint workflows
        run: just lint-workflows

      - name: Coverage
        run: just coverage

      - name: Safety
        run: just safety

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/coverage/

  deploy:
    name: Deploy coverage to GitHub Pages
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.9
        with:
          name: coverage-report
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.2.3
